      <h1>Endorsements</h1>
      <div class="meta">
        <span class="date">January 1, 2000</span>
        <div class="tags"><span class="tag">christianity</span> <span class="tag">theology</span> <span class="tag">church</span> <span class="tag">church-history</span> <span class="tag">common-questions</span> <span class="tag">books</span> <span class="tag">#Beautified</span></div>
      </div>
    </header>
    <div class="article-body">
      <!--kg-card-begin: html--><h2 id="endorsements">Endorsements</h2>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>Joel presents a fascinating overview of how Biblical and Islamic viewpoints on eschatology overlap, making a convincing case that reading this book and studying what the Old and New Testaments have to say about the End Times are imperative for Christians today.  This book is a wake-up call for Christians to learn how the future of the church, the future of Islam and the future of the entire world are divinely and directly interconnected. The reader will also gain significant insight into the nature of the Last Days and the course on which the world is heading at ever increasing speeds.</p>
    <div style="height:0.8em"></div>
    <p>—<b>Dr. Tom White</b>, Executive Director, The Voice of the Martyrs</p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p><span>A fascinating and provocative work.  Joel has broken fresh ground in the ongoing exploration of the relationship between Islam and the rest of the world.  A must read for priests and pastors, students and lay readers everywhere.  Bravo!</span></p>
    <div style="height:0.8em"></div>
    <p><b>—Robert Spencer</b>, Director of Jihadwatch, <span>Author of <i>Islam Unveiled</i> and <i>Onward Muslim Soldiers</i></span></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>This book definitely provides a fresh look at Bible Prophecy in light of current affairs with the global rise of Islamic Fundamentalism.  Not only does Joel accurately analyze those Islamic doctrines and practices that are relevant to Biblical End time prophecy, but his interpretation of Biblical prophecy is also solid - soundly adhering to the accepted rules of hermeneutics.</p>
    <div style="height:0.8em"></div>
    <p>—<strong>Walid Shoebat</strong>, former Palestinian Terrorist and Author of <i>Why I Left Jihad </i></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>Joel Richardson provides a weighty analysis of Islam and its messianic figure.  This book is central to recognizing the fulfillment of biblical end-times prophecy in our day and understanding the role Islam plays in it.</p>
    <div style="height:0.8em"></div>
    <p>—<strong>Pastor Reza F. Safa</strong>, former radical Muslim, Author of <i>Inside Islam</i></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>Joel Richardson serves both the Christian and Muslim communities well. He thoroughly explores the source documents of early Islam and later Muslim theologians and the New Testament. He summarizes them admirably without being too technical. This book clarifies the differences between Christianity and Islam.  It is a must-read for Christians and Muslims alike.</p>
    <div style="height:0.8em"></div>
    <p><b>—James M. Arlandson, Ph.D.</b> teaches at a college in southern California and regularly writes for <a href="http://americanthinker.com/?ref=answeringislam.blog">AmericanThinker.com</a> and <a href="http://answering-islam.org/?ref=answeringislam.blog">Answering-Islam.org</a></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>Joel Richardson has posited a scholarly, thoughtful, compassionate and Scriptural concept regarding the astounding theological anti-parallels between the eschatologies of radical Islam and Biblical faith.  He makes a strong case that this is no mere humanistic coincidence.  However, Joel is neither a knee-jerk reactionary nor a paranoid radical.  He is, rather, a seeker and lover of truth who has the love and courage to simply lay the historical and theological evidences for his convictions out before us and then grants us the dignity of examining the facts for ourselves so that we can draw our own conclusions.  Joel Richardson is a humble servant of Jesus Christ whom I personally know to be a faithful and devoted husband, father and friend to all the people that God has brought his way.  May God grant us all the same courage to open our eyes to the ever-intensifying spiritual warfare we face in this fallen age and also to the beauties of Christ's work in the earth so that we will be able to navigate well in this world until we see our Lord Jesus face to face.</p>
    <div style="height:0.8em"></div>
    <p>—<b><span>Michael Sullivant</span></b><span>, Pastor, conference speaker, Author of <i>Your Kingdom Come</i> and <i>Prophetic Etiquette</i> </span></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>With the mind of a scholar and the heart of an intercessor, Joel Richardson has brought forth an intriguing expose on the coming "battle of the ages".  As militant Islam arises in fury fueled by a raging anti-Semitic spirit, another body of people shall arise at the same time, willing to give their lives for the Gospel of Jesus Christ. Stirring . . . Insightful . . .  a wake up call to all sincere believers.</p>
    <div style="height:0.8em"></div>
    <p>—<b>James W. Goll</b>, Cofounder of Encounters Network, Author of <i>The Seer, The Lost Art of Intercession</i> and <i>Praying for Israel's Destiny</i></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p><span>This is <i>the</i> must read book for anyone interested in end-times Bible prophecy! Joel Richardson has broken fresh ground in the emerging consensus of Islams vital role in the Antichrists kingdom. Joels evidences come straight from the Islamic traditions of the Hadith, a very important source of Muslim doctrine, well-known to Muslims, but unknown to most westerners. Any open-minded reader will be unable to dismiss the uncanny parallels between the Islamic traditions and the biblically described agenda of Antichrist. His clear and insightful presentation on the role of beheading in Islamic law is gripping. His scenario for how the earth will fall into line behind Antichrist is entirely credible. Jesus exhorted us to pray and be alert for the time of testing that is coming on the earth. You will find yourself doing just that. For the reader unsatisfied with anything but the truth, this is a book that absolutely must be added to your library.</span></p>
    <div style="height:0.8em"></div>
    <p><b><span>—Robert Livingston</span></b><span>, Missionary to the Middle East, Author of <i>Christianity and Islam: The Final Clash</i></span></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p><span>Joel Richarson's thorough knowledge of Islam provides Christians with much helpful information on the traditions and teachings of Islam, revealing the striking affinities between Christian end-time prophecy and Islamic expectations of world domination. His balanced use of Islamic texts and the Bible is so convincing that after reading the book, one is hardly able to imagine how the Antichrist could be any other than a Muslim Caliph. But what I appreciate most is that he argues his point not with venom but with tact, even love, as he urges Christians to love their Muslim neighbors and to win them for Christ.  This book is an important read for Christians who wish to learn more about the world's fastest growing religion or who want to be better prepared to dialogue with and witness to Muslims.</span></p>
    <div style="height:0.8em"></div>
    <p><span> —<b>Steve Alt</b>, Assistant Professor of Theology, F.I.R.E. School of Ministry, Concord, NC</span></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>After many years of reflection, I shy away from detailed specifics in end-time scenarios.  However, while this book does contain some such specific details, I nevertheless believe that the basic thrust, that Islam is the Antichrist system of the last-days, is persuasively presented as a very possible scenario.  In addition, the information in this book about Islam and the Antichrist is very important and is not, to my knowledge, accessible elsewhere.  In these days of Islamic terror, an understanding of the information presented in this book, particularly regarding Islamic eschatology, I believe is crucial.  Hence, this book definitely makes an important contribution.  I highly recommend a thoughtful examination of the information contained in these pages.</p>
    <div style="height:0.8em"></div>
    <p><span>—<strong>Dr. Daniel C. Juster</strong>, Author of <i>Jewish Roots</i> and <i>Israel, the Church and the Last Days</i>, Executive Director of Tikkun Ministries International</span></p>
  </blockquote>
</figure>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p>In an era and an age where ambiguity reigns, Joel Richardson has written a book that is clear, well researched, and to the point. Few people in the Christian community have the courage to study world religions, much less invest themselves in it as he has done. Do yourself a favor; get this book, read this book, live out the truths that you pull out of it. It is worth your time, more importantly, souls hang in the balance.</p>
    <div style="height:0.8em"></div>
    <p><span>—<strong>Ergun Caner</strong>, Dean, Liberty Theological Seminary, Liberty University, Lynchburg, VA</span></p>
  </blockquote>
</figure>
