<a name="HOLY_SPIRIT">
<br>
<b>HOLY SPIRIT</b>

The Holy Spirit has variously been interpreted as the angel
Gabriel, spiritual power, etc. The Muslim concept is not
the third person in the Christian doctrine of the Trinity.


Al Saddi and Kaab wrote, "The Holy Spirit is Gabriel, and his 
support of Jesus was by being His companion and friend, helping 
and accompanying Him wherever He went, until He was taken up 
into heaven."

Ibn Jubair explained, "Spirit of the Holy is the supreme name 
for Allah and by it Jesus was raising the dead." 
Ibn Abbas announced, "As it was the spirit which was breathed 
into Him and the Holy One is Allah so He is the Spirit of Allah."
