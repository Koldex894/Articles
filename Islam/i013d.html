      <h1>Calling Together or Ripping Apart?</h1>
      <div class="meta">
        <span class="date">January 1, 2000</span>
        <div class="tags"><span class="tag">christianity</span> <span class="tag">islam</span> <span class="tag">theology</span> <span class="tag">common-questions</span> <span class="tag">islam-rebuttals</span> <span class="tag">responses</span> <span class="tag">#Beautified</span></div>
      </div>
    </header>
    <div class="article-body">
      <!--kg-card-begin: html--><h2 id="further-debate-on-the-issue">Further debate on the issue:</h2>

<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <p><tt><font color="RED">Muslim Responses</font> by <a href="mailto:rmd4islam@aol.com">Randy Desmond</a><br/>
Date: Fri, 18 Oct 1996 04:52:00 PDT
</tt></p>
    <div style="height:0.8em"></div>
    <p>In <small>Surah 41:11</small>, "come ye together" is, according to the Arabic,
like if we were to call to people at the same time (i.e. we
would call them together). This is not a melding together. It is
not understood that way at all.</p>
    <div style="height:0.8em"></div>
    <p>Nevertheless, I understand why you may jump to that conclusion.
I read A. Y. Ali's comment and he understands the verse to be
mentioning that the heavens and earth, once created, were meant to
be kept together, not separate. However, he doesn't say he understands them
to be joined together as one unit as <small>Surah 21:30</small> says. I really do not
know what A. Y. Ali means. Perhaps arranged together? In any case, regardless
what A. Y. Ali's interpretation is, the Arabic is clear.</p>
    <div style="height:0.8em"></div>
    <p>Let me stress the point, the Arabic word in <small>Surah 41:11</small> means "come both of 
you", and then God asks them to submit. In <small>Surah 21:30</small>, the arabic means 
"one piece".  To summarize, it is only the translation which could even give 
someone the idea that there is a contradiction. This is a reason why a
Muslim does not regard translations of the Qur'an as the Arabic Qur'an 
itself.</p>
  </blockquote>
</figure>
