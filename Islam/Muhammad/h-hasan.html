      <!--kg-card-begin: html--><h2 id="hasan-b-ali-b-abi-talib">HASAN B. ALI. B. ABI TALIB</h2>

<p>The son of the 4th <a href="../C/caliph.html">caliph</a> <a href="../A/ali.html">Ali</a> and <a href="../F/fatima.html">Fatima</a>, daughter of <a href="../M/muhammad.html">Muhammad</a>. <a href="../S/shiite.html">Shiites</a> regard him as the 2nd <a href="../I/imam.html">Imam</a> after Ali.</p>

<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>al Hasan died in Medina of poision. His wife Jadah, daughter of al Ashath b Kays poisioned him. Yazid b, Muawiyah suborned her to poision him, promising that he would then marry her, and she did so. And when al Hasan was dead, she went to Yazid claiming the fulfillment of what he had promised, but he replied: I did not approve thee for al Hasan, shall I be content with thee for myself?</p>
<div style="height:0.8em"></div>
<p>(<cite>al-Suyuti, Tarikhul Khulafa, Chapter: al Hasan b. Ali b. Abi Talib, p. 195</cite>)</p>
</blockquote>
</figure>
