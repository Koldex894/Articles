      <!--kg-card-begin: html--><p> 

Suggestion of one Muslim:
</p>

<figure class="kg-card kg-blockquote-card">
<blockquote>
<p></p><dir>
<pre>From: H786N (h786n@aol.com)
Subject: Quranic inheritance 
Newsgroups: soc.religion.islam
Date: 1998/06/19 
 
The error pointed out regarding the inheritance distribution is not accurate. 
The Quranic verse verse 4:12 clearly says that the wife will get 1/8 of what
remains...... after payment of ANY LEGACY and DEBTS. In other words if there be
three daughters and both parents alive, then the wife will not get any thing
after distribution of the legacy, just as many other relatives do not get
anything if there are other heirs alive. The requirements for others, that is
parents and children applies only after the debts are paid. I hope you will
clarify this point.
</pre>
Reference: The <a href="http://www.dejanews.com/getdoc.xp?AN=364029461&ref=answeringislam.blog">the 
newsgroup archives</a>.
</dir><p></p>
</blockquote>
