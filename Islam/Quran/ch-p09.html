      <h1>A Topical Study of the Qur'an</h1>
      <div class="meta">
        <span class="date">January 1, 2000</span>
        <div class="tags"><span class="tag">quran</span> <span class="tag">islam</span> <span class="tag">books</span> <span class="tag">religion</span> <span class="tag">#Beautified</span></div>
      </div>
    </header>
    <div class="article-body">
      <!--kg-card-begin: html--><html><body>
<figure class="kg-card kg-blockquote-card">
  <blockquote>
    <h2 id="chapter-nine">Chapter Nine</h2>
    <div style="height:0.8em"></div>
    <h2 id="paradise">Paradise</h2>
    <div style="height:0.8em"></div>
    <h2 id="preface-and-comparison-with-the-bible">Preface and Comparison with the Bible</h2>
    <div style="height:0.8em"></div>
    <p>Eternal life is not called heaven in the Qur'an. The Muslim concept of a 
heavenly reward is much different than it is described in the Bible. 
Thirty-seven paraphrased verses from the Qur'an are included in this chapter to 
better explain the Muslim view of the Gardens of Paradise.</p>
    <div style="height:0.8em"></div>
    <p>The Qur'an describes these gardens as places of sensual pleasures. Some of 
these pleasures were those denied to Muslims while on earth. On earth, Muslim 
men were limited in the number of wives they could have at one time. The Qur'an 
promises an unlimited supply of virgins waiting for them on plush cushions in 
protected tents. Another earthly restriction was against the drinking of 
alcohol. In the Eternal Gardens there are endless supplies of wine, which can be 
drunk without harmful consequences. The residents of the Gardens are continually 
grateful.</p>
    <div style="height:0.8em"></div>
    <p>The image of heaven, revealed in the Bible, does not include sexual 
relations. The Lord Jesus made it clear that those in heaven will not be 
married, but will be like the angels of God <small>(Matthew 22:30)</small>. The prevailing 
image of heaven in the Bible is that of worship of God and fellowship between 
people from every ethnic group <small>(Revelation 7:9)</small>.</p>
    <div style="height:0.8em"></div>
    <figure class="kg-card kg-blockquote-card">
      <blockquote>
        <h2 id="the-quran-says">The Qur'an Says ...</h2>
        <div style="height:0.8em"></div>
        <h3 id="desires-met">Desires Met</h3>
        <div style="height:0.8em"></div>
        <p>The afterlife of Muslims will be a place where all their desires are not only met but exceeded <small>(50:35)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="endless-fountain-of-wine">Endless Fountain of Wine</h3>
        <div style="height:0.8em"></div>
        <p>The righteous will drink from a endlessly flowing fountain of wine, which is mixed with Kafur water <small>(76:5-6)</small>. It will be a white wine that will not intoxicate those in the Garden of Bliss <small>(37:45-47)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="gardens">Gardens</h3>
        <div style="height:0.8em"></div>
        <p>The delights of the afterlife will take place in two gardens full of all kinds of sensual pleasures <small>(55:46-48)</small>. In addition, there are two other gardens, which are also filled with delights in them <small>(55:62)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="virgins">Virgins</h3>
        <div style="height:0.8em"></div>
        <p>In the Gardens are fruits, shade, fountains and virgins. The virgins are bashful and as beautiful as rubies and corals <small>(55:56,58)</small>. There will be additional dark eyed heavenly companions in the second set of Gardens who will be forced to stay in their large peaked tents. Neither men nor genies will have touched them. Their chastity will be safe until the arrival of those who are granted admission to Paradise. They wait reclining on green cushions and beautiful carpets <small>(55:70-76)</small>. These companions will all be equally high breasted (youthful) <small>(78:33)</small>. In the gardens, the Muslims will be united in sexual relations with companions (houris) who have beautiful, large and dark eyes <small>(52:20, 44:54, 2:25)</small>. Virgins will surround them who are bashful with large delicate eyes like eggs <small>(37:48-49)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="handsome-boy-servants">Handsome Boy Servants</h3>
        <div style="height:0.8em"></div>
        <p>They will be served by devoted youths who are as handsome as valuable pearls. They will wait on their every need <small>(52:24)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="food-and-drink">Food and Drink</h3>
        <div style="height:0.8em"></div>
        <p>In the Garden on high, Muslims will eat and drink to their hearts content <small>(69:24)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="praise-and-fellowship">Praise and Fellowship</h3>
        <div style="height:0.8em"></div>
        <p>In the Gardens of Delight rivers will run at the feet of the residents. They will cry out their praise and greet one another by saying, Peace! <small>(10:9-10)</small>. They give glory night and day without getting tired <small>(41:38)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="gold-and-silk">Gold and Silk</h3>
        <div style="height:0.8em"></div>
        <p>Those in the Gardens of Eternity will be adorned with bracelets of gold and dressed in fine green silk which have raised designs of gold woven into them <small>(18:31, 35:33)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="earthly-wives-and-families">Earthly Wives and Families</h3>
        <div style="height:0.8em"></div>
        <p>Muslims, whose children followed Islam, will be reunited with them in the Gardens of Bliss so that the fathers will not be deprived of what they accomplished on earth <small>(52:21)</small>. Muslims will enter the Gardens of Eden, as will all of their fathers, wives and offspring who followed Islam <small>(13:23)</small>.</p>
        <div style="height:0.8em"></div>
        <h3 id="mansions">Mansions</h3>
        <div style="height:0.8em"></div>
        <p>It is a commandment to believe in Allah and Mohammed. It is mandatory to fight for Islam with everything the Muslims have, even with their lives, so that Allah will forgive their sins and allow them into the Gardens of Eden where they will have large residences <small>(61:11-12)</small>. Those who deserve it will have lofty mansions at the foot of which will flow rivers <small>(39:20)</small>.</p>
      </blockquote>
    </figure>
  </blockquote>
</figure>
