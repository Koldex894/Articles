      <h1>A Topical Study of the Qur'an</h1>
      <div class="meta">
        <span class="date">January 1, 2000</span>
        <div class="tags"><span class="tag">quran</span> <span class="tag">islam</span> <span class="tag">books</span> <span class="tag">#Beautified</span></div>

<figure class="kg-card kg-blockquote-card">

    <p style="text-align:center;"><i>Chapter Seven</i></p>
    <p style="text-align:center;"><b>Creation and Science</b></p>

    <h3 id="preface-and-comparison-with-the-bible">Preface and Comparison with the Bible</h3>
    <p>Most Muslims claim that the Qur'ans views of creation and science agree with 
modern science. They feel strongly about this because they believe the Qur'an 
must be flawless in every way or it is not a divine revelation. The validity of 
this claim needs to be questioned. Such inquiry logically begins with the 
Islamic story of creation.</p>
    <div style="height:0.8em"></div>
    <p>Is there a creation story in the Qur'an? It does not have one complete 
passage that covers the subject as in the beginning of the Bible. The Qur'anic 
verses on creation are scattered throughout the Muslim text. In this chapter, 
one hundred forty-nine verses have been collected, arranged and paraphrased to 
provide a quick guide to what Islam teaches on the origin of the universe, earth 
and mankind.</p>
    <div style="height:0.8em"></div>
    <p>There are similarities between the Biblical and Islamic accounts. For 
example, both the Bible and the Qur'an describe the sun as rising and setting. 
This is a typical way to describe the passing of a day even in modern times, yet 
the Qur'an goes beyond what the Bible teaches about the actions of the sun and 
moon. For example, it claims that a mighty man saw the sun land in a muddy pool 
in the far west. In addition the Qur'an explains that the sun and moon orbit the 
earth and are not allowed to catch up with each other.</p>
    <div style="height:0.8em"></div>
    <p>There are differences as well between the Bible and the Qur'an. One example 
has to do with mountains. The Bible describes how the earth was covered with 
water until the land came up out of the sea, but the Qur'an declares that the 
earth was leveled flat then mountains were set down on the earth from above. The 
mountains were placed on the earth to keep the land from sliding around.</p>
    <div style="height:0.8em"></div>
    <p>The first verse of the Bible describes how the sun and moon, along with all 
the heavens and earth were created, yet, the Bible makes it clear that the sun 
and moon were not made to function for seasons until the fourth day. Christian 
creationists claim that this might have been due to a thick cloud cover over the 
earth. The Qur'an states that the sun and moon were created after the earth. The 
Qur'an goes on to reveal that they were hung as lights on the dome of the sky.
</p>
    <div style="height:0.8em"></div>
    <p>The Qur'an adds information not found in the Bible. For example, the Bible 
says nothing about the purpose of shooting stars but the Qur'an explains that 
they are fiery missiles which chase off genies from listening to what is taking 
place above the dome of the sky where Allah is on his throne. (The Qur'an 
teaches that jinn or genies are spiritual beings, maybe best compared to 
demons, though not all of them are evil. They are understood to have a free will 
and some of them have become Muslims.)</p>
    <div style="height:0.8em"></div>
    <p>The cosmology of the Qur'an seems consistent with the Arabic understanding of 
the time of Mohammed. It certainly does not seem to agree with modern science. 
The non-Muslim reader needs to appreciate the difficulty Muslim fundamentalists 
experience as they try to harmonize the following verses with the facts that are 
known about the universe.</p>

    <h2 id="the-quran-says">The Qur'an Says ...</h2>

    <figure class="kg-card kg-blockquote-card">
      <blockquote>

        <h3 id="six-days">Six Days</h3>
        <p>The creation was completed in six days <small>(10:3)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="order">Order</h3>
        <p>In four days the earth was completed. Then attention was given to the sky, which was still smoke. In 
two days seven heavens were created with the lower heaven adorned with lights <small>(41:10-12)</small>. Everything on earth was created before Allah turned to the sky or heaven and fashioned seven levels of heavens <small>(2:29, 41:10-12)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="flat-earth">Flat Earth</h3>
        <p>The earth was leveled flat or spread out in the creation event <small>(88:20, 15:19, 79:30)</small>. Allah will not let it cave in beneath mankind <small>(67:16)</small>. Both the earth and the heavens would fall if it were not for the sustaining power of Allah. If they did fall, no one could hold them back <small>(35:41, 16:45)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="mountains-set-down">Mountains Set Down</h3>
        <p>Mountains were set down on the earth like giant immovable weights or pegs in order to keep the flat earth from moving <small>(15:19, 21:31, 31:10, 88:19, 16:15, 79:32, 78:7)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="man">Man</h3>
        <p>Man was created to be in distress <small>(90:4)</small>. Man was first created from clay. He then procreates as the essence of clay becomes a living germ and is put into the womb. The germ transforms into a clot of blood. The blood clot becomes a small mass, which is fashioned into bones. The bones are then covered with flesh. This is the amazing developmental process by which life is generated and regenerated <small>(23:12-14)</small>. Each man begins as a discharged semen, which becomes a clot of blood and then is given male or female parts <small>(76:37-39)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="woman">Woman</h3>
        <p>A mate for man was created so that he might find comfort as he rests with her and produces offspring <small>(7:189)</small>. Men were made superior to women, which means they exercise authority over females and must beat them if they are rebellious. This is why women depend on men for their support <small>(4:34)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="sky-is-a-dome">Sky Is a Dome</h3>
        <p>The sky and the heavens were still just smoke after the completion of the earth with its living things and mountains <small>(41:10-11, 2:29)</small>. The sky was built up as a dome over the earth <small>(2:22, 21:32)</small>. It was raised on high as a canopy <small>(79:28)</small>. It continues to be amazing that it has no visible pillars or cracks <small>(31:10, 50:6)</small>. It was built up, decorated with bright ornaments and has no cracks or defects <small>(50:6)</small>. It remains to be a threat as a piece of the sky could fall on an individual as a form of punishment <small>(34:9)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="stars-are-lamps">Stars Are Lamps</h3>
        <p>Above the earth were constructed seven layers of heavens which are miraculously kept from falling. The lower level is decorated with lighted lamps <small>(41:12, 67:5)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="zodiac-signs">Zodiac Signs</h3>
        <p>The sky was decorated with the signs of the zodiac to make it beautiful <small>(15:16, 25:61)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="falling-stars-chase-genies">Falling Stars Chase Genies</h3>
        <p>Shooting stars are made for a special purpose. They are lamps that are thrown as fiery missiles at genies (jinn) who try to fly up toward the sky in order to spy on the activities of heaven <small>(37:6-10, 15:17-18, 67:5, 26:210-212)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="satan">Satan</h3>
        <p>Prior to the creation of humans, Satan was created out of smokeless fire. He was punished for refusing a command to bow before Adam, the man who was sculpted and brought to life from clay. When he was banished and degraded to the earth, Satan swore to mislead people. Adam and Eve were his first victims. He was one of the genies <small>(15:28-39, 7:11-23, 18:50)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="evil-spirits">Evil Spirits</h3>
        <p>Genies were made from fire that has no smoke <small>(55:15)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="sun-and-moon-orbit-earth">Sun and Moon Orbit Earth</h3>
        <p>After the seven heavens were built over the earth, the sun was put into service <small>(13:2-3, 78:12-13)</small>. The sun is a shining lamp <small>(25:61, 78:13)</small>. The sun swims its rounded course and comes to a resting-place <small>(36:40, 18:86)</small>. The sun is not allowed to catch up with the moon and the moon is not allowed to overtake the sun as they run their prescribed orbits <small>(36:37-40, 21:32-33)</small>. Allah swears by the sun with his midday brightness and the moon, how she rises to follow him <small>(91:1-2)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="adam-and-eve">Adam and Eve</h3>
        <p>Adam and Eve were created in a garden paradise in heaven. All the angels but Satan obeyed Allah by bowing before Adam. Satan was forever degraded because of this disobedience. Satan, in turn, tempted Adam and Eve to eat from the tree that Allah had forbidden them to even approach. Because of this, Allah cast Adam and Eve out of the heavenly garden and placed them on the earth <small>(7:11-25)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="superman">Superman</h3>
        <p>A mighty man was made who was given the power to do anything. His name was Dhul-Qarnain. Among other things, he traveled on a road so far west that he saw where the sun landed in a pool of black mud. He was given authority to rule them and he was harsh with the people he found there. He traveled on another road so far to the East that he saw a kind of people who were close to the rising sun as it 
started its journey. They had been left without any protection against the 
nearness of the burning suns rays. He left those people alone. Another of 
his exploits was to construct a huge dam made of iron blocks and coated it 
with molten lead. It completely filled the space between two steep mountains 
and was so massive that the people of Gog and Magog (Russia) could not scale 
it or dig through it to disturb their neighbors. The great dam will survive 
until the Judgment Day <small>(18:83-100)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="semen">Semen</h3>
        <p>Look at the semen you emit. Did you create it, or are we the Creators <small>(56:58-59)</small>? The male and the female are created in the womb when a drop is poured fourth <small>(53:45-46)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="birds">Birds</h3>
        <p>Birds are a sign to encourage belief since there is no natural reason why they are suspended between the earth and the sky. It is only by Allahs miraculous power <small>(16:79)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="shadows">Shadows</h3>
        <p>Allah lengthens and shortens the shadows. He could have made them stationary. The sun guides them <small>(25:45)</small>.</p>
        <div style="height:0.8em"></div>

        <h3 id="throne">Throne</h3>
        <p>After the heavens were finished, Allah, who built them, went to sit down on his throne in heaven. Allah continues to hold the heavens and the earth so that they might not disappear <small>(10:3, 13:2, 20:5, 25:59, 35:41, 57:4)</small>. Those who hold up Allahs throne and surround it constantly pray that those Muslims who deserve it would be forgiven <small>(40:7-9)</small>.</p>

      </blockquote>
