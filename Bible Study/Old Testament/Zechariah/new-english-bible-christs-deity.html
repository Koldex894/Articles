      <h1>New English Bible &amp; Christ’s Deity</h1>
      <div class="meta">
        <span class="date">April 19, 2026</span>
        <div class="tags"><span class="tag">bible</span> <span class="tag">jesus</span> <span class="tag">god</span> <span class="tag">trinity</span> <span class="tag">holy-spirit</span> <span class="tag">zechariah</span> <span class="tag">#Beautified</span></div>
      </div>
    </header>
    <div class="article-body">
      
<!--kg-card-begin: html-->
<p>The verses cited here in respect to the Deity of Christ are taken from the New English Bible (NEB).</p>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“but I will pour a spirit of pity and compassion into the line of David and the inhabitants of Jerusalem. Then <strong>They shall look on me, on him whom they have pierced</strong>, and shall wail over him as over an only child, and shall grieve for him bitterly as for a first-born son.” Zechariah 12:10</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“Jesus then came up and is spoke to them. He said: <strong>'Full authority in heaven and on earth has been committed to me</strong>.&nbsp;Go forth therefore and make all nations my disciples; baptize men everywhere <strong>in the name of the Father and the Son and the Holy Spirit</strong>,&nbsp;and teach them to observe all that I have commanded you. And be assured, <strong>I am with you always, to the end of time</strong>.'” Matthew 28:18-20</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“WHEN ALL THINGS BEGAN, <strong>the Word already was</strong>. The Word dwelt with God, <strong>and what God was, the Word was</strong>. The Word, then, was with God at the beginning, and through him all things came to be; no single thing was created without him. A<strong>ll that came to be was alive with his life</strong>, and that life was the light of men... The real light which enlightens every man was even then coming into the world. He was in the world; but the world, <strong>though it owed its being to him</strong>, did not recognize him... <strong>So the Word became flesh</strong>; he came to dwell among us, and we saw his glory, such glory as befits the Father's only Son, full of grace and truth... No one has ever seen God; but God's only Son, he who is nearest to the Father's heart, he has made him known.” John 1:1-4, 9-10, 14, 18</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“‘My own sheep listen to my voice; I know them and they follow me.&nbsp;<strong>I give them eternal life and they shall never perish; no one shall snatch them from my care</strong>.&nbsp;My Father who has given them to me is greater than all, and no one can snatch them [Some witnesses read: My Father is greater than all, and that which he has given me <strong>no one can snatch</strong>&nbsp;...; others read: That which my Father has given me is greater than all, <strong>and no one can snatch it</strong>&nbsp;...] <strong>out of the Father's care</strong>. <strong>My Father and I are one</strong>.'</p>
<div style="height:0.8em"></div>
<p>“Once again the Jews picked up stones to stone him.&nbsp;At this Jesus said to them, 'I have set before you many good deeds, done by my Father's power, for which of these would you stone me?'&nbsp;The Jews replied, 'We are not going to stone you for any good deed, but for your blasphemy. <strong>You, a mere man, claim to be a god</strong>.' [Or: <strong>claim to be God</strong>.]” John 10:27-33</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“Then he said to Thomas, 'Reach your finger here: see my hands; reach your hand here and put it into my side; be unbelieving no longer, but believe.'&nbsp;<strong>Thomas said, 'My Lord and my God!</strong>'&nbsp;Jesus said, 'Because you have seen me you have found faith. <strong>Happy are they who never saw me and yet have found faith</strong>.'” John 20:27-29</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“Keep watch over yourselves and over all the flock of which the Holy Spirit has given you charge, as shepherds <strong>of the church of the Lord</strong>, [Some witnesses read: <strong>of God</strong>.] which he won for himself <strong>by his own blood</strong>. [Or, according to some witnesses: <strong>by the blood of his Own</strong>.]” Acts 20:28</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“Theirs are the patriarchs, and from them, in natural descent, sprang the Messiah. [Greek: Christ.] May God, supreme above all, be blessed for ever! Amen. [Or: sprang the Messiah, <strong>supreme above all, God blessed for ever</strong>; Or: sprang the Messiah, <strong>who is supreme above all</strong>. Blessed be God for ever!]” Romans 9:5</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“yet for us there <strong>is one God, the Father, from whom all being comes</strong>, towards whom we move; and there <strong>is one Lord, Jesus Christ, through whom all things came to be</strong>, and we through him.” 1 Corinthians 8:6</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“Let your bearing towards one another arise out of your life in Christ Jesus. <strong>For the divine nature was his from the first</strong>; yet he did not think to snatch at equality with God, but made himself nothing, assuming the nature of a slave. Bearing the human likeness, revealed in human shape, he humbled himself, and in obedience accepted even death–death on a cross.</p>
<div style="height:0.8em"></div>
<p>“Therefore God raised him to the heights and bestowed on him the name above all names, <sup>[</sup><a href="https://web.archive.org/web/20150910154344/http:/www.katapi.org.uk/katapiNSBunix/RSV/RSVTextByBC.php?B=23&C=45&BoldKFm=23045023.00&BoldKTo=23045023.00" rel="noopener"><u><sup>Is.45.23</sup></u></a><sup>.]&nbsp;</sup>that at the name of Jesus every knee should bow—in heaven, on earth, and in the depths—and every tongue confess, 'Jesus Christ is Lord', to the glory of God the Father.” Philippians 2:5-11</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“He rescued us from the domain of darkness and brought us away into the kingdom of his dear Son,&nbsp;in whom our release is secured and our sins forgiven.&nbsp;He is the image of the invisible God; <strong>his is the primacy over all created things. In him everything in heaven and on earth was created</strong>, not only things visible but also the invisible orders of thrones, sovereignties, authorities, and powers: the whole universe <strong>has been created through him and for him. And he exists before everything, and all things are held together in him</strong>. He is, moreover, the head of the body, the church. He is its origin, the first to return from the dead, to be in all things alone supreme. <strong>For in him the complete being of God, by God's own choice, came to dwell</strong>. Through him God chose to reconcile the whole universe to himself, making peace through the shedding of his blood upon the cross—to reconcile all things, whether on earth or in heaven, through him alone.” Colossians 1:13-20</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>"For it is in Christ that the complete being of the Godhead dwells embodied, [Or: corporately.]" Colossians 2:9</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“looking forward to the happy fulfilment of our hopes when the splendour <strong>of our great God and Saviour Christ Jesus</strong>&nbsp;will appear.” Titus 2:13</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“But in this the final age he has spoken to us in the Son whom he has made heir to the whole universe, <strong>and through whom he created all orders of existence</strong>:&nbsp;the Son who is the effulgence of God's splendour <strong>and the stamp of God's very being, and sustains the universe by his word of power.</strong>&nbsp;When he had brought about the purgation of sins, he took his seat at the right hand of Majesty on high... <sup>[</sup><a href="https://web.archive.org/web/20150910105036/http:/www.katapi.org.uk/katapiNSBunix/RSV/RSVTextByBC.php?B=5&C=31&BoldKFm=5032043.00&BoldKTo=5032043.00" rel="noopener"><u><sup>Dt.32.43</sup></u></a><sup>,&nbsp;</sup><a href="https://web.archive.org/web/20150910105036/http:/www.katapi.org.uk/katapiNSBunix/RSV/RSVTextByBC.php?B=19&C=97&BoldKFm=19097007.00&BoldKTo=19097007.00" rel="noopener"><u><sup>Ps.97.7</sup></u></a><sup>.]&nbsp;</sup>Again, when he presents the first-born to the world, he says, 'Let all the angels of God pay him homage.'...&nbsp;<sup>[</sup><a href="https://web.archive.org/web/20150910105036/http:/www.katapi.org.uk/katapiNSBunix/RSV/RSVTextByBC.php?B=19&C=45&BoldKFm=19045007.00&BoldKTo=19045007.00" rel="noopener"><u><sup>Ps.45.6-7</sup></u></a><sup>.]&nbsp;</sup>but of the Son, '<strong>Thy throne, O God, is for ever and ever</strong>, And the sceptre of justice is the sceptre of his kingdom. Thou hast loved right and hated wrong; Therefore, O God, thy God has set thee above thy fellows, By anointing with the oil of exultation.'&nbsp;<sup>[&nbsp;</sup><a href="https://web.archive.org/web/20150910105036/http:/www.katapi.org.uk/katapiNSBunix/RSV/RSVTextByBC.php?B=19&C=102&BoldKFm=19102025.00&BoldKTo=19102027.00" rel="noopener"><u><sup>Ps.102.25-27</sup></u></a><sup>.]&nbsp;</sup>And again, <strong>'By thee. Lord</strong>, were earth's foundations laid of old, And the heavens are the work <strong>of thy hands</strong>. They shall pass away, but thou endurest; Like clothes they shall all grow old; <strong>Thou shalt fold them up</strong>&nbsp;like a cloak; Yes, they shall be changed like any garment. <strong>But thou art the same, and thy years shall have no end</strong>.'” Hebrews 1:2-3, 6, 8-12</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“FROM SIMEON PETER,&nbsp;servant and apostle of Jesus Christ,&nbsp;to those who through the justice <strong>of our God and Saviour Jesus Christ</strong>&nbsp;share our faith and enjoy equal privilege with ourselves.” 2 Peter 1:1</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“But grow in the grace and in the knowledge <strong>of our Lord and Saviour Jesus Christ</strong>. [Or: But grow up, by the grace <strong>of our Lord and Saviour Jesus Christ</strong>, and by knowing him.] <strong>To him be glory now and for all eternity!</strong>” 2 Peter 3:18</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“It is in danger from certain persons who have wormed their way in, the very men whom Scripture long ago marked down for the doom they have incurred. They are the enemies of religion; they pervert the free favour of our God into licentiousness, disowning <strong>Jesus Christ, our only Master and Lord</strong>... It was to them that Enoch, the seventh in descent from Adam, directed his prophecy when he said: <strong>'I saw the Lord come with his myriads of angels</strong>,&nbsp;to bring all men to judgement and to convict all the godless of all the godless deeds they had committed, and of all the defiant words which godless sinners had spoken against him.'... But you, my friends, should remember the predictions made by the apostles <strong>of our Lord Jesus Christ</strong>...&nbsp;But you, my friends, must fortify yourselves in your most sacred faith. Continue to pray in the power <strong>of the Holy Spirit</strong>.&nbsp;Keep yourselves in the love <strong>of God</strong>, and look forward to <strong>the day when our Lord Jesus Christ in his mercy will give eternal life</strong>... to <strong>the only God our Saviour</strong>, be glory and majesty, might and authority, through <strong>Jesus Christ our Lord</strong>, before all time, now, and for evermore. Amen.” Jude 1:4, 14-15, 17, 20-21, 25</p>
</blockquote>
</figure>


<figure class="kg-card kg-blockquote-card">
<blockquote>
<p>“'To the angel of the church at Laodicea write: These are the words of the Amen, the faithful and true witness, <strong>the prime source of all God's creation</strong>:’” Revelation 3:14</p>
</blockquote>
</figure>
